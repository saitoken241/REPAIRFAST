<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepairFast — Analista</title>

<!-- Compartilhados -->
<link rel="stylesheet" href="src/css/global.css">
<link rel="stylesheet" href="src/css/components.css">
<script src="src/js/api.js"></script>
<script src="src/js/utils.js"></script>

<style>
/* ══════════════════════════════════════════
   Estilos específicos do Analista
══════════════════════════════════════════ */

/* Page header */
.page-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
.greeting { font-family:var(--fd); font-size:clamp(20px,2.5vw,28px); letter-spacing:1px; line-height:1; }
.greeting span { color:var(--orange); }
.sub-greeting { font-size:13px; color:var(--text-muted); margin-top:4px; }
.header-actions { display:flex; align-items:center; gap:10px; }

.notif-btn { position:relative; width:38px; height:38px; background:var(--dark3); border:1px solid var(--border); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; transition:border-color .2s; }
.notif-btn:hover { border-color:var(--orange-border); }
.notif-dot { position:absolute; top:7px; right:7px; width:7px; height:7px; background:var(--orange); border-radius:50%; border:2px solid var(--dark3); display:none; }

.btn-new { display:flex; align-items:center; gap:8px; padding:10px 18px; background:var(--orange); color:white; border:none; border-radius:10px; font-family:var(--fb); font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; transition:background .2s,transform .15s; }
.btn-new:hover { background:var(--orange-bright); transform:translateY(-1px); }
.btn-new svg { width:15px; height:15px; fill:white; flex-shrink:0; }

.btn-logout { display:flex; align-items:center; gap:7px; padding:9px 16px; background:transparent; color:var(--text-muted); border:1px solid var(--border); border-radius:10px; font-family:var(--fb); font-size:13px; cursor:pointer; white-space:nowrap; transition:all .2s; text-decoration:none; }
.btn-logout:hover { background:rgba(232,92,26,0.08); color:var(--orange); border-color:var(--orange-border); }
.btn-logout svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

/* Summary */
.summary-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 22px; }
.sum-card { background: var(--dark2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s; animation: fadeUp 0.35s ease both; }
.sum-card:nth-child(1){animation-delay:.04s} .sum-card:nth-child(2){animation-delay:.08s}
.sum-card:nth-child(3){animation-delay:.12s} .sum-card:nth-child(4){animation-delay:.16s}
.sum-card:hover { transform: translateY(-2px); border-color: var(--c, var(--border)); }
.sum-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--c, var(--border)); }
.sum-icon { margin-bottom: 8px; display:flex; align-items:center; }
.sum-val  { font-family: var(--fd); font-size: clamp(24px,3vw,32px); letter-spacing: 1px; line-height: 1; color: var(--c, var(--text)); }
.sum-lbl  { font-size: 11px; color: var(--text-muted); margin-top: 4px; }



/* Tabela */
.report-table { width: 100%; border-collapse: collapse; }
.report-table th { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); padding: 0 12px 10px; text-align: left; font-weight: 500; font-family: var(--fb); white-space: nowrap; }
.report-table td { padding: 10px 12px; border-top: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.report-table tr.report-row { cursor: pointer; transition: background 0.15s; }
.report-table tr.report-row:hover { background: var(--dark3); }
.report-table tr.report-row:hover .row-actions { opacity: 1; }
.row-title    { font-weight: 500; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-id       { font-family: var(--fm); font-size: 11px; color: var(--text-dim); }
.row-reporter { display: flex; align-items: center; gap: 7px; }
.row-av       { width: 22px; height: 22px; border-radius: 50%; background: var(--mid); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
.row-date     { font-family: var(--fm); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
.row-actions  { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
.action-btn   { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; border: 1px solid var(--border); background: var(--dark4); color: var(--text-muted); cursor: pointer; font-family: var(--fb); transition: all 0.15s; white-space: nowrap; }
.action-btn:hover         { color: var(--text);   border-color: rgba(255,255,255,.15); background: var(--mid); }
.action-btn.assign:hover  { color: var(--blue);   border-color: var(--blue-b);         background: var(--blue-dim); }
.action-btn.status:hover  { color: var(--yellow); border-color: var(--yellow-b);       background: var(--yellow-dim); }
.action-btn.comment:hover { color: var(--green);  border-color: var(--green-b);        background: var(--green-dim); }

/* Paginação */
.pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; flex-wrap: wrap; gap: 10px; }
.page-info  { font-size: 12px; color: var(--text-muted); }
.page-btns  { display: flex; gap: 4px; }
.page-btn   { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-family: var(--fb); }
.page-btn:hover  { background: var(--dark3); color: var(--text); }
.page-btn.active { background: var(--orange-dim); border-color: var(--orange-border); color: var(--orange); font-weight: 600; }

/* Search + Filtros */
.filter-row   { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-sep   { width: 1px; background: var(--border); align-self: stretch; }
.search-box   { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--dark3); border: 1px solid var(--border); border-radius: 8px; flex: 1; min-width: 180px; transition: border-color 0.2s; }
.search-box:focus-within { border-color: var(--orange-border); }
.search-box input { background: none; border: none; outline: none; color: var(--text); font-family: var(--fb); font-size: 13px; flex: 1; min-width: 0; }
.search-box input::placeholder { color: var(--text-dim); }
.search-icon  { font-size: 14px; opacity: .5; flex-shrink: 0; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 800; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-overlay.open { display: flex; }
.modal        { background: var(--dark3); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 90%; max-width: 420px; animation: fadeUp 0.25s ease both; position: relative; }
.modal-close  { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }
.modal-title  { font-family: var(--fd); font-size: 22px; letter-spacing: 1px; margin-bottom: 6px; }
.modal-sub    { font-size: 12px; color: var(--text-muted); margin-bottom: 20px; }
.modal-label  { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; display: block; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.modal-select, .modal-textarea { width: 100%; padding: 10px 12px; background: var(--dark4); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--fb); font-size: 13px; outline: none; transition: border-color 0.2s; margin-bottom: 14px; }
.modal-select:focus, .modal-textarea:focus { border-color: var(--orange-border); }
.modal-textarea { resize: vertical; min-height: 80px; }
.btn-cancel  { padding: 9px 18px; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-family: var(--fb); font-size: 13px; cursor: pointer; transition: all 0.15s; }
.btn-cancel:hover { background: var(--dark4); color: var(--text); }
.btn-confirm { padding: 9px 20px; background: var(--orange); border: none; border-radius: 8px; color: white; font-family: var(--fb); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
.btn-confirm:hover { background: var(--orange-bright); }

/* Tags */
.tag { padding: 2px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; }

/* Responsive específico */
@media (max-width: 1024px) { .hide-md { display: none; } }
@media (max-width: 768px)  { .summary-row { grid-template-columns: 1fr 1fr; } .row-actions { opacity: 1; } .hide-sm { display: none; } }
@media (max-width: 480px)  { .summary-row { grid-template-columns: 1fr 1fr; gap: 10px; } .filter-row { gap: 8px; } .fab { display: flex; } }
</style>
</head>
<body>

<div class="app">

  <!-- MAIN -->
  <main class="main">

    <!-- CABEÇALHO -->
    <div class="page-header">
      <div>
        <div class="greeting" id="greeting">—</div>
        <div class="sub-greeting" id="sub-greeting">Carregando...</div>
      </div>
      <div class="header-actions">
        <div class="notif-btn">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <div class="notif-dot" id="notif-dot"></div>
        </div>
        <button class="btn-new" onclick="abrirNovoReporte()">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>Novo Reporte</span>
        </button>
        <a href="login.html" class="btn-logout" title="Sair">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </a>
      </div>
    </div>

    <!-- SUMMARY -->
    <div class="summary-row">
      <div class="sum-card" style="--c:var(--text-muted)">
        <div class="sum-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <div class="sum-val" id="sum-total">—</div>
        <div class="sum-lbl">Total no Setor</div>
      </div>
      <div class="sum-card" style="--c:var(--orange)">
        <div class="sum-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--orange)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="sum-val" id="sum-aberto">—</div>
        <div class="sum-lbl">Em Aberto</div>
      </div>
      <div class="sum-card" style="--c:var(--blue)">
        <div class="sum-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="sum-val" id="sum-andamento">—</div>
        <div class="sum-lbl">Em Andamento</div>
      </div>
      <div class="sum-card" style="--c:var(--green)">
        <div class="sum-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="sum-val" id="sum-resolvido">—</div>
        <div class="sum-lbl">Resolvidos</div>
      </div>
    </div>


    <!-- TODOS OS REPORTES -->
    <div class="panel">
      <div class="panel-hd">
        <div>
          <div class="panel-title">REPORTES DO SETOR — <span id="setor-nome" style="color:var(--orange)">—</span></div>
          <div class="panel-sub" id="panel-sub">Carregando...</div>
        </div>
      </div>

      <div class="filter-row">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.6"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar por título, ID ou colaborador..." oninput="aplicarFiltros()">
        </div>
        <div class="filter-group" id="filterStatus">
          <button class="filter-pill active" onclick="setFiltro('status','todos',this)">Todos</button>
          <button class="filter-pill" onclick="setFiltro('status','aberto',this)">Abertos</button>
          <button class="filter-pill" onclick="setFiltro('status','andamento',this)">Andamento</button>
          <button class="filter-pill" onclick="setFiltro('status','resolvido',this)">Resolvidos</button>
        </div>
        <div class="filter-sep"></div>
        <div class="filter-group" id="filterPrio">
          <button class="filter-pill active" onclick="setFiltro('prio','todos',this)">Todas</button>
          <button class="filter-pill" onclick="setFiltro('prio','alta',this)">Alta</button>
          <button class="filter-pill" onclick="setFiltro('prio','media',this)">Média</button>
          <button class="filter-pill" onclick="setFiltro('prio','baixa',this)">Baixa</button>
        </div>
      </div>

      <div style="overflow-x:auto">
        <table class="report-table">
          <thead>
            <tr>
              <th>ID</th><th>Título</th>
              <th class="hide-md">Colaborador</th>
              <th>Prioridade</th><th>Status</th>
              <th class="hide-sm">Data</th>
            </tr>
          </thead>
          <tbody id="reportTableBody"></tbody>
        </table>
      </div>

      <div class="pagination">
        <div class="page-info" id="pageInfo">—</div>
        <div class="page-btns" id="pageBtns"></div>
      </div>
    </div>

  </main>
</div>

<!-- FAB mobile -->
<button class="fab">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
</button>

<!-- MODAL AÇÃO RÁPIDA -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" onclick="fecharModal()">×</button>
    <div class="modal-title" id="modalTitle">—</div>
    <div class="modal-sub"   id="modalSub">—</div>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn-cancel"  onclick="fecharModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmarAcao()">Confirmar</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   ANALISTA — lógica específica desta página
   Config, mock e utilitários vêm de api.js e utils.js
══════════════════════════════════════════════════ */

/* ── Render ── */
function renderAnalista(a) {
  document.getElementById("greeting").innerHTML =
    `${saudacao()}, <span>${a.nome.toUpperCase()}</span>`;
  setText("sub-greeting", `${diaSemana()}, ${dataHoje()} · Analista · ${a.setor}`);
  setText("setor-nome", a.setor);
}

function renderResumo(r) {
  setText("sum-total",        r.total);
  setText("sum-aberto",       r.aberto);
  setText("sum-andamento",    r.andamento);
  setText("sum-resolvido",    r.resolvido);
  setText("sb-badge-abertos", r.aberto);
  setText("panel-sub",        `${r.total} reportes no setor · ${r.aberto} aguardando atenção`);
}




/* ── Tabela + Paginação ── */
const PER_PAGE = 8;
let _reportes = [], _filtrados = [], _pagina = 1;
let _filtroStatus = 'todos', _filtrosPrio = 'todos';

function renderReportes(lista) { _reportes = lista; aplicarFiltros(); }

function aplicarFiltros() {
  const busca = document.getElementById("searchInput").value.toLowerCase();
  _filtrados = _reportes.filter(r => {
    const okStatus = _filtroStatus === 'todos' || r.status === _filtroStatus;
    const okPrio   = _filtrosPrio  === 'todos' || r.prioridade === _filtrosPrio;
    const okBusca  = !busca || r.titulo.toLowerCase().includes(busca)
                            || String(r.id).includes(busca)
                            || r.reporter.toLowerCase().includes(busca);
    return okStatus && okPrio && okBusca;
  });
  _pagina = 1;
  _drawTabela();
}

function _drawTabela() {
  const body   = document.getElementById("reportTableBody");
  const total  = _filtrados.length;
  const inicio = (_pagina - 1) * PER_PAGE;
  const pagina = _filtrados.slice(inicio, inicio + PER_PAGE);

  if (!pagina.length) {
    body.innerHTML = `<tr><td colspan="7">
      <div class="empty-state">
        <div class="empty-icon"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="var(--text-dim)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
        <div class="empty-title">Nenhum reporte encontrado</div>
        <div class="empty-desc">Tente ajustar os filtros ou a busca.</div>
      </div></td></tr>`;
  } else {
    body.innerHTML = pagina.map(r => {
      const st  = STATUS_MAP[r.status]         || { cls:"", label:r.status };
      const pr  = PRIORIDADE_MAP[r.prioridade] || { cls:"", label:r.prioridade };
      const ini = r.reporter.split(" ").map(w => w[0]).join("").slice(0,2);
      return `
      <tr class="report-row" onclick="abrirReporte(${r.id})">
        <td><span class="row-id">#${r.id}</span></td>
        <td><div class="row-title">${r.titulo}</div></td>
        <td class="hide-md">
          <div class="row-reporter">
            <div class="row-av">${ini}</div>${r.reporter}
          </div>
        </td>
        <td><span class="tag ${pr.cls}">${pr.label}</span></td>
        <td><span class="tag ${st.cls}">${st.label}</span></td>
        <td class="hide-sm"><span class="row-date">${r.data}</span></td>
      </tr>`;
    }).join('');
  }

  const totalPags = Math.ceil(total / PER_PAGE);
  setText("pageInfo", `Mostrando ${Math.min(inicio+1,total)}–${Math.min(inicio+PER_PAGE,total)} de ${total} reportes`);
  document.getElementById("pageBtns").innerHTML = Array.from({length: totalPags}, (_,i) =>
    `<button class="page-btn${i+1===_pagina?' active':''}" onclick="irPagina(${i+1})">${i+1}</button>`
  ).join('');
}

function irPagina(n) { _pagina = n; _drawTabela(); }

function setFiltro(tipo, val, btn) {
  const grupo = tipo === 'status' ? '#filterStatus' : '#filterPrio';
  document.querySelectorAll(`${grupo} .filter-pill`).forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  if (tipo === 'status') _filtroStatus = val;
  else _filtrosPrio = val;
  aplicarFiltros();
}

/* ── Modal ── */
let _modalTipo = '', _modalId = null;

function abrirModal(tipo, id, titulo) {
  _modalTipo = tipo; _modalId = id;
  setText("modalSub", `Reporte #${id} — ${titulo}`);
  const body = document.getElementById("modalBody");

  if (tipo === 'atribuir') {
    setText("modalTitle", "ATRIBUIR REPORTE");
    body.innerHTML = `
      <label class="modal-label">Responsável</label>
      <select class="modal-select" id="modalInput">
        <option value="">Selecione um colaborador</option>
        <option>Ricardo Santos (você)</option>
        <option>Ana Paula Ferreira</option>
        <option>ken</option>
        <option>Marcos Vinícius</option>
      </select>`;
  } else if (tipo === 'status') {
    setText("modalTitle", "ATUALIZAR STATUS");
    body.innerHTML = `
      <label class="modal-label">Novo Status</label>
      <select class="modal-select" id="modalInput">
        <option value="aberto">Aberto</option>
        <option value="andamento">Em andamento</option>
        <option value="resolvido">Resolvido</option>
      </select>`;
  } else if (tipo === 'comentar') {
    setText("modalTitle", "ADICIONAR COMENTÁRIO");
    body.innerHTML = `
      <label class="modal-label">Comentário</label>
      <textarea class="modal-textarea" id="modalInput" placeholder="Descreva a atualização ou observação..."></textarea>`;
  }

  document.getElementById("modalOverlay").classList.add('open');
}

function fecharModal() {
  document.getElementById("modalOverlay").classList.remove('open');
}

function confirmarAcao() {
  const val = document.getElementById("modalInput")?.value;
  if (!val) return;
  if (_modalTipo === 'status')   patchReporteStatus(_modalId, val);
  if (_modalTipo === 'atribuir') patchReporteAtribuir(_modalId, val);
  if (_modalTipo === 'comentar') postComentario(_modalId, val);
  // atualiza localmente no mock
  if (_modalTipo === 'status') {
    const r = MOCK.reportesAnalista.find(r => r.id === _modalId);
    if (r) { r.status = val; aplicarFiltros(); }
  }
  fecharModal();
}

// fechar modal clicando fora
document.getElementById("modalOverlay").addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});

/* ── Init ── */
async function init() {
  try {
    showSkeleton("reportTableBody", 5, "40px");
    const [analista, resumo, reportes] = await Promise.all([
      getAnalistaMe(), getResumoSetor(), getReportesSetor()
    ]);
    renderAnalista(analista);
    renderResumo(resumo);
    renderReportes(reportes);
  } catch(err) {
    console.error(err);
    showError("reportTableBody", 7);
  }
}

function abrirReporte(id) {
  const reporte = _reportes.find(r => r.id === id);
  if (reporte) sessionStorage.setItem('reporteAtual', JSON.stringify({ id: reporte.id, ...reporte }));
  window.location.href = 'report_detail_analyst.html';
}

function abrirNovoReporte() {
  localStorage.setItem('perfil', 'analista');
  window.location.href = 'report_create.html';
}

/* ── Proteção de rota ──────────────────────────────────────────────
   Verifica se o usuário está autenticado antes de renderizar a página.
   Se não houver token no localStorage, redireciona para o login.
   Se o perfil salvo não for "analista", redireciona para o home
   correto do perfil detectado.
──────────────────────────────────────────────────────────────────── */
(function protegerRota() {
  const token  = localStorage.getItem('token');
  const perfil = localStorage.getItem('perfil');

  if (!token) {
    window.location.replace('login.html');
    return;
  }

  const homeMap = {
    funcionario: 'home_employee.html',
    gestor:      'home_manager.html',
    analista:    'home_analyst.html',
  };

  if (perfil && perfil !== 'analista' && homeMap[perfil]) {
    window.location.replace(homeMap[perfil]);
  }
}());

init();
</script>
</body>
