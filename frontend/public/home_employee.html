<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RepairFast — Início</title>

<!-- Compartilhados -->
<link rel="stylesheet" href="../src/css/global.css">
<link rel="stylesheet" href="../src/css/components.css">
<script src="../src/js/api.js"></script>
<script src="../src/js/utils.js"></script>

<style>
/* ══════════════════════════════════════════
   Estilos específicos do Funcionário
══════════════════════════════════════════ */

/* Page header */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.greeting { font-family: var(--fd); font-size: clamp(20px, 2.5vw, 28px); letter-spacing: 1px; line-height: 1; }
.greeting span { color: var(--orange); }
.sub-greeting { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.header-actions { display: flex; align-items: center; gap: 10px; }

/* Botão notificação */
.notif-btn {
  position: relative; width: 38px; height: 38px;
  background: var(--dark3); border: 1px solid var(--border);
  border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 17px; cursor: pointer;
  transition: border-color 0.2s;
}
.notif-btn:hover { border-color: var(--orange-border); }
.notif-dot {
  position: absolute; top: 7px; right: 7px;
  width: 7px; height: 7px;
  background: var(--orange); border-radius: 50%;
  border: 2px solid var(--dark3); display: none;
}

/* Botão novo reporte */
.btn-new { display: flex; align-items: center; gap: 8px; padding: 10px 18px; background: var(--orange); color: white; border: none; border-radius: 10px; font-family: var(--fb); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background 0.2s, transform 0.15s; }
.btn-new:hover { background: var(--orange-bright); transform: translateY(-1px); }
.btn-new svg { width: 15px; height: 15px; fill: white; flex-shrink: 0; }

/* Botão sair */
.btn-logout { display:flex; align-items:center; gap:7px; padding:9px 16px; background:transparent; color:var(--text-muted); border:1px solid var(--border); border-radius:10px; font-family:var(--fb); font-size:13px; cursor:pointer; white-space:nowrap; transition:all .2s; text-decoration:none; }
.btn-logout:hover { background:rgba(232,92,26,0.08); color:var(--orange); border-color:var(--orange-border); }
.btn-logout svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }

/* Summary cards */
.summary-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 22px; }
.sum-card { background: var(--dark2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; position: relative; overflow: hidden; transition: transform 0.2s, border-color 0.2s; animation: fadeUp 0.35s ease both; }
.sum-card:nth-child(1){animation-delay:.04s} .sum-card:nth-child(2){animation-delay:.08s}
.sum-card:nth-child(3){animation-delay:.12s} .sum-card:nth-child(4){animation-delay:.16s}
.sum-card:hover { transform: translateY(-2px); border-color: var(--c, var(--border)); }
.sum-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--c, var(--border)); }
.sum-icon { margin-bottom: 8px; display: flex; align-items: center; }
.sum-val  { font-family: var(--fd); font-size: clamp(24px,3vw,32px); letter-spacing: 1px; line-height: 1; color: var(--c, var(--text)); }
.sum-lbl  { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* Content grid */
.content-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

/* Report card */
.report-list  { display: flex; flex-direction: column; gap: 10px; }
.report-card  { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; background: var(--dark3); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.15s; animation: fadeUp 0.3s ease both; }
.report-card:hover { border-color: var(--orange-border); background: var(--dark4); }
.rc-icon  { width: 38px; height: 38px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.rc-body  { min-width: 0; }
.rc-title { font-size: 13px; font-weight: 500; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc-meta  { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.rc-tag   { padding: 2px 8px; border-radius: 6px; font-size: 11px; white-space: nowrap; }
.rc-setor { background: var(--dark4); color: var(--text-muted); border: 1px solid var(--border); }
.rc-date  { font-size: 11px; color: var(--text-dim); font-family: var(--fm); }
.rc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.rc-id    { font-family: var(--fm); font-size: 11px; color: var(--text-dim); }
.rc-arrow { font-size: 18px; color: var(--text-muted); }

/* Responsive específico */
@media (max-width: 768px) {
  .summary-row { grid-template-columns: 1fr 1fr; }
  .btn-new span { display: none; }
  .btn-new { padding: 10px 12px; }
}
@media (max-width: 480px) {
  .summary-row { grid-template-columns: 1fr 1fr; gap: 10px; }
  .report-card { grid-template-columns: auto 1fr; }
  .rc-right { display: none; }
  .header-actions .btn-new { display: none; }
  .content-grid { gap: 12px; }
}
</style>
</head>
<body>

<div class="app">
  <main class="main">

    <!-- CABEÇALHO -->
    <div class="page-header">
      <div>
        <div class="greeting" id="greeting">—</div>
        <div class="sub-greeting" id="sub-greeting">Carregando...</div>
      </div>
      <div class="header-actions">
        <div class="notif-btn">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <button class="btn-new" onclick="abrirNovoReporte()">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span>Novo Reporte</span>
        </button>
        <a href="login.html" class="btn-logout" title="Sair">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </a>
      </div>
    </div>

    <div class="summary-row">
      <div class="sum-card" style="--c:var(--text-muted)">
        <div class="sum-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <div class="sum-val" id="sum-total">—</div>
        <div class="sum-lbl">Total de Reportes</div>
      </div>
      <div class="sum-card" style="--c:var(--orange)">
        <div class="sum-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--orange)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        </div>
        <div class="sum-val" id="sum-aberto">—</div>
        <div class="sum-lbl">Em Aberto</div>
      </div>
      <div class="sum-card" style="--c:var(--blue)">
        <div class="sum-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--blue)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="sum-val" id="sum-andamento">—</div>
        <div class="sum-lbl">Em Andamento</div>
      </div>
      <div class="sum-card" style="--c:var(--green)">
        <div class="sum-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--green)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="sum-val" id="sum-resolvido">—</div>
        <div class="sum-lbl">Resolvidos</div>
      </div>
    </div>

    <!-- CONTENT GRID -->
    <div class="content-grid">
      <div class="panel">
        <div class="panel-hd">
          <div>
            <div class="panel-title">MEUS REPORTES</div>
            <div class="panel-sub">Últimos registros enviados por você</div>
          </div>

        </div>
        <div class="filter-bar">
          <button class="filter-pill active" onclick="filtrar('todos',this)">Todos</button>
          <button class="filter-pill" onclick="filtrar('aberto',this)">Abertos</button>
          <button class="filter-pill" onclick="filtrar('andamento',this)">Em andamento</button>
          <button class="filter-pill" onclick="filtrar('resolvido',this)">Resolvidos</button>
        </div>
        <div class="report-list" id="reportList"></div>
      </div>
    </div>

  </main>
</div>

<!-- FAB mobile -->
<button class="fab" onclick="abrirNovoReporte()">＋</button>

<script>
/* ══════════════════════════════════════════════════
   FUNCIONÁRIO — lógica específica desta página
   Config, mock e utilitários vêm de api.js e utils.js
══════════════════════════════════════════════════ */

const STATUS_SVG = {
  aberto:    `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  andamento: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,
  resolvido: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
};

function renderUsuario(u) {
  document.getElementById("greeting").innerHTML =
    `${saudacao()}, <span>${u.nome.toUpperCase()}</span>`;
  setText("sub-greeting", `${diaSemana()}, ${dataHoje()} · ${u.turno} · ${u.setor}`);
}

function renderResumo(r) {
  setText("sum-total",     r.total);
  setText("sum-aberto",    r.aberto);
  setText("sum-andamento", r.andamento);
  setText("sum-resolvido", r.resolvido);
}

let _reportes = [];
function renderReportes(lista) { _reportes = lista; _drawList(lista); }

function _drawList(lista) {
  const el = document.getElementById("reportList");
  if (!lista.length) {
    showEmpty("reportList", "Nenhum reporte encontrado", "Nenhuma ocorrência registrada ainda.");
    return;
  }
  el.innerHTML = lista.map((r, i) => {
    const st = STATUS_MAP[r.status]         || { cls:"", label:r.status, bg:"var(--dark4)", emoji:"📋" };
    const pr = PRIORIDADE_MAP[r.prioridade] || { cls:"", label:r.prioridade };
    return `
    <div class="report-card" style="animation-delay:${i * .05}s" onclick="abrirReporte(${r.id})">
      <div class="rc-icon" style="background:${st.bg};color:${st.color || 'var(--text-muted)'}">${STATUS_SVG[r.status] || STATUS_SVG.aberto}</div>
      <div class="rc-body">
        <div class="rc-title">${r.titulo}</div>
        <div class="rc-meta">
          <span class="rc-tag ${st.cls}">${st.label}</span>
          <span class="rc-tag ${pr.cls}">${pr.label}</span>
          <span class="rc-tag rc-setor">${r.setor}</span>
          <span class="rc-date">${r.data}</span>
        </div>
      </div>
      <div class="rc-right">
        <span class="rc-id">#${r.id}</span>
        <span class="rc-arrow">›</span>
      </div>
    </div>`;
  }).join('');
}

function filtrar(status, btn) {
  ativarFiltro(btn);
  _drawList(status === 'todos' ? _reportes : _reportes.filter(r => r.status === status));
}

/* Init */
async function init() {
  try {
    showSkeleton("reportList");
    const [usuario, resumo, reportes] = await Promise.all([
      getUsuarioMe(), getResumoFuncionario(), getReportesFuncionario()
    ]);
    renderUsuario(usuario);
    renderResumo(resumo);
    renderReportes(reportes);
  } catch(err) {
    console.error(err);
    showError("reportList");
  }
}

function abrirNovoReporte() {
  localStorage.setItem('perfil', 'funcionario');
  window.location.href = 'report_create.html';
}

function abrirReporte(id) {
  const reporte = _reportes.find(r => r.id === id);
  if (reporte) sessionStorage.setItem('reporteAtual', JSON.stringify({ id: reporte.id, ...reporte }));
  window.location.href = 'report_detail_tracking.html';
}

init();
</script>
</body>
</html>
